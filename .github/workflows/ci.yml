name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq
      - name: shellcheck
        run: shellcheck depl-cmd commands install
      - name: Tests
        run: bats tests
